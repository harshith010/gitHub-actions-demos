name: output_demo
on: push
jobs:
  build:
    outputs:
      version: ${{ steps.one.outputs.version}}
    runs-on: ubuntu-latest
    steps:
      - name: step 1
        id: one
        run: echo "version=0.02" >> $GITHUB_OUTPUT
#      - name: step 2
#        run: echo "this version is ${{ steps.one.outputs.version }}"
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: step 2
        run: echo "We are deploying app with version ${{ needs.build.outputs.version}}"